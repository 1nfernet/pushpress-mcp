[project]
name = "pushpress-mcp"
version = "0.1.0"
description = "Local, read-only MCP server for my PushPress member workouts, scores and leaderboards"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.28.1",
    "mcp>=2.3.0",
    "playwright>=1.63.0",
]

[project.scripts]
pushpress-mcp = "pushpress_mcp.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pushpress_mcp"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["scripts"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
